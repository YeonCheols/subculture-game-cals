name: Build mobile apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:platform
      - run: npm run mobile:sync
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gametime-release.p12"
      - name: Build signed Android APK and bundle
        run: ./gradlew assembleRelease bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gametime-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: gametime-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run mobile:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphoneos/App.app GameTime-${{ github.ref_name }}-ios-unsigned-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gametime-ios-unsigned-app
          path: GameTime-${{ github.ref_name }}-ios-unsigned-app.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Rename mobile release assets
        shell: bash
        run: |
          apk_path=$(find release-assets -type f -name app-release.apk -print -quit)
          aab_path=$(find release-assets -type f -name app-release.aab -print -quit)
          if [ -z "$apk_path" ] || [ -z "$aab_path" ]; then
            echo "Android release assets were not found." >&2
            exit 1
          fi
          mv "$apk_path" "release-assets/GameTime-${{ github.ref_name }}-android.apk"
          mv "$aab_path" "release-assets/GameTime-${{ github.ref_name }}-android.aab"

      - name: Publish mobile GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes --title "GameTime ${{ github.ref_name }}" || true
          fi
          gh release upload "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --clobber
