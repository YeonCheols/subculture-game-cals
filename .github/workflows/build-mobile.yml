name: Build mobile apps

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:platform
      - run: npm run mobile:sync
      - run: ./gradlew bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: gametime-android-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run mobile:sync
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: gametime-ios-unsigned-app
          path: build/ios/Build/Products/Release-iphoneos/App.app
